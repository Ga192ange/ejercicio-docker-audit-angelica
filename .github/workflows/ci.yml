name: CI - Auditoría y Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest

      - name: Ejecutar pruebas
        run: pytest -v

  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: pip install bandit

      - name: Ejecutar Bandit
        run: bandit -r . -x ./.venv -f screen

  trivy:
    name: Trivy (escaneo de imagen)
    runs-on: ubuntu-latest
    needs: [test, bandit]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t ejercicio-docker-audit-angelica:ci .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ejercicio-docker-audit-angelica:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  deploy:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    needs: [test, bandit, trivy]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Conectarse a EC2 y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ejercicio-docker-audit-angelica
            git remote prune origin
            git fetch --prune origin
            git reset --hard origin/main
            docker compose down
            docker compose up --build -d